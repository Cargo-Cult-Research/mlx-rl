[project]
name = "mlx-rl"
version = "0.1.0"
description = "GRPO-style RL fine-tuning of LoRA adapters on Apple Silicon (MLX)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
]
dependencies = [
    "mlx>=0.31.2",
    "mlx-lm>=0.31.3",
    "numpy>=2.5.1",
    "psutil>=7.2.2",
    "transformers>=5.12,<5.13",
]

[project.scripts]
mlx-rl-train = "mlx_rl.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a locally cached model"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
